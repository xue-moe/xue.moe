  <script>
    (function() {
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }
      function setShared(name, val) {
        try { localStorage.setItem(name, val); } catch (_) {}
        const isXue = location.hostname === 'xue.moe' || location.hostname.endsWith('.xue.moe');
        const d = isXue ? '; domain=.xue.moe' : '';
        document.cookie = `${name}=${encodeURIComponent(val)}; path=/; max-age=31536000; SameSite=Lax${d}`;
      }

      const params = new URLSearchParams(location.search);
      const qTheme = params.get('theme');
      const qLang = params.get('lang');

      const theme = (qTheme === 'dark' || qTheme === 'light') ? qTheme
        : (localStorage.getItem('xue-theme') || getCookie('xue-theme'));
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
        setShared('xue-theme', theme);
      }

      const rawLang = qLang ? qLang.toLowerCase() : null;
      const lang = (rawLang === 'zh' || rawLang === 'en') ? rawLang
        : (localStorage.getItem('xue-lang') || getCookie('xue-lang') || (navigator.language && navigator.language.startsWith('en') ? 'en' : 'zh'));
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
      setShared('xue-lang', lang);

      if (qTheme || qLang) {
        params.delete('theme');
        params.delete('lang');
        const cleanSearch = params.toString();
        const cleanUrl = location.pathname + (cleanSearch ? '?' + cleanSearch : '') + location.hash;
        try { history.replaceState(null, '', cleanUrl); } catch (_) {}
      }
    })();

    let currentLang = document.documentElement.getAttribute('data-lang') || localStorage.getItem('xue-lang') || (navigator.language && navigator.language.startsWith('en') ? 'en' : 'zh');

    function setSharedPref(name, val) {

    function attachCrossDomainPrefs(link) {

          url.searchParams.set('lang', curLang);
          if (curTheme) url.searchParams.set('theme', curTheme);
          link.href = url.toString();
        }

    const cells = [];
    let internalUpdate = false;
    let targetWasAuto = false;
    let deductionStep = 0;
    let allSolutions = [];
    let currentResultIndex = 0;
    let lastFixed = [];
    let lastCandidates = [];

    const lines = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]

    for (let i = 0; i < 9; i++) {
      const input = document.createElement('input');
      input.type = 'number';
      input.step = '1';

      input.setAttribute('data-1p-ignore', '');
      input.setAttribute('data-bwignore', '');
      input.dataset.index = i;
      input.dataset.source = '';

      input.addEventListener('focus', () => {
        if (input.dataset.source === 'solved') {
          input.select();
        }
      });

      input.addEventListener('input', () => {
        if (internalUpdate) return;
        const val = input.value.trim();

        if (val === '') {
          input.classList.remove('manual', 'solved', 'candidate');
          input.dataset.source = '';
        } else {
          input.classList.remove('solved', 'candidate');
          input.classList.add('manual');
          input.dataset.source = 'manual';
        }

        clearSolvedCells(input);
        clearResults();
        if (autoDetectTarget() !== false) tryAutoSolve();
      });

      input.addEventListener('keydown', event => {
        const index = Number(input.dataset.index);
        const row = Math.floor(index / 3);
        const col = index % 3;
        let next = null;

        if (event.key === 'ArrowUp' && row > 0) next = index - 3;
        if (event.key === 'ArrowDown' && row < 2) next = index + 3;
        if (event.key === 'ArrowLeft' && col > 0) next = index - 1;
        if (event.key === 'ArrowRight' && col < 2) next = index + 1;

        if (event.key === 'Backspace' && input.value === '' && index > 0) {
          event.preventDefault();
          cells[index - 1].focus();
          cells[index - 1].select();
          return;
        }

        if (next !== null) {
          event.preventDefault();
          cells[next].focus();
          cells[next].select();
          return;
        }

        if (event.key === 'Tab' && !event.shiftKey && index === 8) {
          event.preventDefault();
          targetSumEl.focus();
          targetSumEl.select();
          return;
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          runSolve();
        }
      });

      gridEl.appendChild(input);
      cells.push(input);

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');

    function clearSolvedCells(exceptCell = null) {
      deductionStep = 0;
      targetSumEl.classList.remove('deduction-reveal');
      cells.forEach(cell => cell.classList.remove('deduction-reveal'));
      internalUpdate = true;
      cells.forEach(cell => {
        if (cell !== exceptCell && cell.dataset.source === 'solved') {
          cell.value = '';
          cell.dataset.source = '';
          cell.classList.remove('solved', 'candidate');
        }
      });
      internalUpdate = false;
    }

    function clearResults() {
      allSolutions = [];
      currentResultIndex = 0;

      resultsCountEl.textContent = '';
      resultsCard.classList.remove('show');
      nav.classList.remove('show');
      gridNav.classList.remove('show');

    function clearAll() {
      clearSolvedCells();
      internalUpdate = true;
      cells.forEach(cell => {
        cell.value = '';
        cell.dataset.source = '';
        cell.classList.remove('manual', 'solved', 'candidate');
      });
      targetSumEl.value = '';
      candidateValuesEl.value = '';
      targetWasAuto = false;
      internalUpdate = false;

      clearResults();
      setStatus(i18n[currentLang].statusReset);
      cells[0].focus();
    }

    function readManualValues() {
      return cells.map((cell, index) => {
        if (cell.dataset.source !== 'manual' || cell.value.trim() === '') return null;
        const value = Number(cell.value);
        if (!Number.isInteger(value) || value <= 0) {
          throw new Error(i18n[currentLang].errCellInt(index));
        }
        return value;
      });
    }

    // Every 3×3 magic square has three parameters: center e and offsets p, q.
    // These integer coefficients describe twice each cell: 2e + bp + cq.
    const cellCoefficients = [
      [2, 1, 1], [2, -2, 0], [2, 1, -1],
      [2, 0, -2], [2, 0, 0], [2, 0, 2],
      [2, -1, 1], [2, 2, 0], [2, -1, -1]
    ];

    function determinant3([a, b, c]) {
      return a[0] * (b[1] * c[2] - b[2] * c[1])
        - a[1] * (b[0] * c[2] - b[2] * c[0])
        + a[2] * (b[0] * c[1] - b[1] * c[0]);
    }

    function inferTargetSums(values) {
      const sums = [];
      if (values[4] !== null) sums.push(3 * values[4]);
      for (const [a, b] of [[0, 8], [1, 7], [2, 6], [3, 5]]) {
        if (values[a] !== null && values[b] !== null) {
          sums.push(3 * (values[a] + values[b]) / 2);
        }
      }
      for (const line of lines) {
        if (line.every(i => values[i] !== null)) {
          sums.push(line.reduce((sum, i) => sum + values[i], 0));
        }
      }

      // Independent triples also determine e, including 124 and 126 and all
      // rotations/reflections. Singular triples are covered by the rules above.
      const known = values.map((value, i) => value === null ? null : i)
        .filter(i => i !== null);
      for (let a = 0; a < known.length; a++) {
        for (let b = a + 1; b < known.length; b++) {
          for (let c = b + 1; c < known.length; c++) {
            const indices = [known[a], known[b], known[c]];
            const rows = indices.map(i => cellCoefficients[i]);
            const det = determinant3(rows);
            if (det === 0) continue;
            const centerRows = indices.map(i => [2 * values[i], ...cellCoefficients[i].slice(1)]);
            sums.push(3 * determinant3(centerRows) / det);
          }
        }
      }
      return sums;
    }

    function clearAutoTarget() {
      if (!targetWasAuto) return;
      internalUpdate = true;
      targetSumEl.value = '';
      internalUpdate = false;
      targetWasAuto = false;
    }

    function revealDeduction(element) {
      element.classList.remove('deduction-reveal');
      element.style.animationDelay = `${deductionStep++ * 100}ms`;
      void element.offsetWidth;
      element.classList.add('deduction-reveal');
    }

    function fillInferredCell(index, value, candidates = []) {
      const cell = cells[index];
      if (cell.dataset.source === 'manual') return;
      const changed = cell.value === '' || Number(cell.value) !== value;
      internalUpdate = true;
      cell.value = value;
      cell.dataset.source = 'solved';
      cell.classList.remove('solved', 'candidate');
      cell.classList.add(candidates.includes(value) ? 'candidate' : 'solved');
      if (changed) revealDeduction(cell);
      internalUpdate = false;
    }

    function fillInferredCenter(center) {
      fillInferredCell(4, center);
    }

    function fillCertainCells(solutions, fixed, candidates) {
      // Show the center first, then complements of known cells, then any other
      // cells that agree in every valid solution. Never choose an arbitrary grid.
      const order = [...new Set([4, ...fixed.flatMap((value, i) => value === null ? [] : [8 - i]),
        0, 1, 2, 3, 5, 6, 7, 8])];
      for (const i of order) {
        const value = solutions[0][i];
        if (solutions.every(solution => solution[i] === value)) {
          fillInferredCell(i, value, candidates);
        }
      }
    }

    function autoDetectTarget() {
      const values = cells.map(cell => {
        if (cell.dataset.source !== 'manual' || cell.value.trim() === '') return null;
        const n = Number(cell.value);
        return Number.isInteger(n) && n > 0 ? n : null;
      });

      const sums = inferTargetSums(values);

      if (sums.length === 0) {
        clearAutoTarget();
        setStatus(i18n[currentLang].statusUpdated);
        return;
      }

      const uniqueSums = [...new Set(sums)];
      if (uniqueSums.length > 1) {
        clearAutoTarget();
        setStatus(
          i18n[currentLang].errConflictSum(uniqueSums.join(currentLang === 'zh' ? '、' : ', ')),
          'error'
        );
        return false;
      }

      const detected = uniqueSums[0];
      const center = detected / 3;
      if (!Number.isInteger(center) || center <= 0) {
        clearAutoTarget();
        setStatus(i18n[currentLang].errInferredCenter(center), 'error');
        return false;
      }

      if (targetSumEl.value.trim() === '' || targetWasAuto) {
        internalUpdate = true;
        const changed = targetSumEl.value !== String(detected);
        targetSumEl.value = detected;
        if (changed) revealDeduction(targetSumEl);
        internalUpdate = false;
        targetWasAuto = true;
        fillInferredCenter(center);
        setStatus(i18n[currentLang].okAutoDetected(detected), 'ok');
        return;
      }

      const current = Number(targetSumEl.value);
      if (Number.isFinite(current) && current !== detected) {
        setStatus(
          i18n[currentLang].errTargetMismatch(detected, current),
          'error'
        );
        return false;
      } else {
        fillInferredCenter(center);
        setStatus(i18n[currentLang].statusUpdated);
      }
    }

    function readTarget() {
      if (targetSumEl.value.trim() === '') {
        throw new Error(i18n[currentLang].errNeedTarget);
      }
      const target = Number(targetSumEl.value);
      if (!Number.isInteger(target) || target <= 0) {
        throw new Error(i18n[currentLang].errTargetPosInt);
      }
      return target;
    }

    function readCandidates() {
      const text = candidateValuesEl.value.trim();
      if (!text) return [];

      const parts = text
        .split(/[\s,，;；]+/)
        .map(v => v.trim())
        .filter(Boolean);

      const values = parts.map(Number);
      if (values.some(v => !Number.isInteger(v) || v <= 0)) {
        throw new Error(i18n[currentLang].errCandidatesPosInt);
      }

      return [...new Set(values)];
    }

    function equationForCell(index, value, e) {
      switch (index) {
        case 0: return [ 1,  1, 2 * (value - e)];
        case 1: return [ 1,  0, e - value];
        case 2: return [ 1, -1, 2 * (value - e)];
        case 3: return [ 0,  1, e - value];
        case 4: return null;
        case 5: return [ 0,  1, value - e];
        case 6: return [-1,  1, 2 * (value - e)];
        case 7: return [ 1,  0, value - e];
        case 8: return [-1, -1, 2 * (value - e)];
      }
    }

    function buildGrid(e, p, q) {
      return [
        e + (p + q) / 2,
        e - p,
        e + (p - q) / 2,
        e - q,
        e,
        e + q,
        e + (-p + q) / 2,
        e + p,
        e - (p + q) / 2
      ];
    }

    function validateGrid(grid, fixed, target, uniqueOnly) {
      if (grid.some(v => !Number.isInteger(v) || v <= 0)) return false;

      for (let i = 0; i < 9; i++) {
        if (fixed[i] !== null && grid[i] !== fixed[i]) return false;
      }

      if (uniqueOnly && new Set(grid).size !== 9) return false;

      return lines.every(line =>
        line.reduce((sum, i) => sum + grid[i], 0) === target
      );
    }

    function solveAssignment(target, fixed, assignment, uniqueOnly) {
      if (target % 3 !== 0) return [];

      const e = target / 3;
      if (fixed[4] !== null && fixed[4] !== e) return [];
      if (assignment.has(4) && assignment.get(4) !== e) return [];

      const equations = [];
      for (let i = 0; i < 9; i++) {
        let value = fixed[i];
        if (assignment.has(i)) {
          if (value !== null && value !== assignment.get(i)) return [];
          value = assignment.get(i);
        }
        if (value === null || i === 4) continue;
        equations.push(equationForCell(i, value, e));
      }

      let uniquePQ = null;
      for (let i = 0; i < equations.length; i++) {
        for (let j = i + 1; j < equations.length; j++) {
          const [a1, b1, c1] = equations[i];
          const [a2, b2, c2] = equations[j];
          const det = a1 * b2 - a2 * b1;
          if (det !== 0) {
            const p = (c1 * b2 - c2 * b1) / det;
            const q = (a1 * c2 - a2 * c1) / det;
            uniquePQ = { p, q };
            break;
          }
        }
        if (uniquePQ) break;
      }

      const results = [];
      const seen = new Set();

      function testPQ(p, q) {
        if (!Number.isInteger(p) || !Number.isInteger(q)) return;
        if ((p + q) % 2 !== 0) return;
        if (equations.some(([a, b, c]) => a * p + b * q !== c)) return;

        const grid = buildGrid(e, p, q);
        if (!validateGrid(grid, fixed, target, uniqueOnly)) return;
        for (const [pos, val] of assignment) {
          if (grid[pos] !== val) return;
        }

        const key = grid.join(',');
        if (!seen.has(key)) {
          seen.add(key);
          results.push(grid);
        }
      }

      if (uniquePQ) {
        testPQ(uniquePQ.p, uniquePQ.q);
        return results;
      }

      const eq = equations[0];
      for (let p = -e + 1; p < e; p++) {
        if (!eq) {
          for (let q = -e + 1; q < e; q++) {
            testPQ(p, q);
          }
        } else {
          const [a, b, c] = eq;
          if (b === 0) {
            if (a * p !== c) continue;
            for (let q = -e + 1; q < e; q++) {
              testPQ(p, q);
            }
          } else {
            const q = (c - a * p) / b;
            testPQ(p, q);
          }
        }
      }

      return results;
    }

    function enumerateSolutions(target, fixed, candidates, uniqueOnly) {
      const fixedSet = new Set(fixed.filter(v => v !== null));
      const neededCandidates = candidates.filter(c => !fixedSet.has(c));

      const emptyPositions = [];
      for (let i = 0; i < 9; i++) {
        if (fixed[i] === null) emptyPositions.push(i);
      }

      if (neededCandidates.length > emptyPositions.length) return [];

      const allFound = [];
      const globalSeen = new Set();

      function kPermutations(arr, k) {
        if (k === 0) return [[]];
        const res = [];
        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          const rest = arr.slice(0, i).concat(arr.slice(i + 1));
          for (const perm of kPermutations(rest, k - 1)) {
            res.push([item, ...perm]);
          }
        }
        return res;
      }

      if (neededCandidates.length === 0) {
        return solveAssignment(target, fixed, new Map(), uniqueOnly);
      }

      const posChoices = kPermutations(emptyPositions, neededCandidates.length);

      for (const positions of posChoices) {
        const assignment = new Map();
        for (let i = 0; i < neededCandidates.length; i++) {
          assignment.set(positions[i], neededCandidates[i]);
        }

        const sols = solveAssignment(target, fixed, assignment, uniqueOnly);
        for (const sol of sols) {
          const key = sol.join(',');
          if (!globalSeen.has(key)) {
            globalSeen.add(key);
            allFound.push(sol);
          }
        }
      }

      return allFound;
    }

    function createResultItem(gridValues, labelText, index) {
      const item = document.createElement('div');
      item.className = 'result-item';
      if (index === currentResultIndex) item.classList.add('active');

      const label = document.createElement('div');
      label.className = 'result-label';
      label.textContent = labelText;

      const miniGrid = document.createElement('div');
      miniGrid.className = 'result-grid';

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'result-cell';
        cell.textContent = gridValues[i];

        if (lastFixed[i] !== null) {
          cell.classList.add('known');
        } else if (lastCandidates.includes(gridValues[i])) {
          cell.classList.add('candidate');
        } else {
          cell.classList.add('solved');
        }

        miniGrid.appendChild(cell);
      }

      item.appendChild(label);
      item.appendChild(miniGrid);

      item.addEventListener('click', () => {
        goToSolution(index);
      });

      return item;
    }

    function showSolutionInMainGrid(solution, index) {
      internalUpdate = true;
      for (let i = 0; i < 9; i++) {
        const cell = cells[i];
        if (cell.dataset.source !== 'manual') {
          fillInferredCell(i, solution[i], lastCandidates);
        }
      }
      internalUpdate = false;

      if (allSolutions.length > 1) {
        gridNav.classList.add('show');
        gridNavCount.textContent = i18n[currentLang].gridNavLabel(index + 1, allSolutions.length);
        gridPrevBtn.disabled = index === 0;
        gridNextBtn.disabled = index === allSolutions.length - 1;
      } else {
        gridNav.classList.remove('show');
      }
    }

    function goToSolution(index) {
      if (index < 0 || index >= allSolutions.length) return;
      deductionStep = 0;
      currentResultIndex = index;
      showSolutionInMainGrid(allSolutions[index], index);

      const t = i18n[currentLang];
      if (allSolutions.length >= 5) {
        resultsCountEl.textContent = t.resultsCountPaginated(allSolutions.length, currentResultIndex + 1);
        resultsList.innerHTML = '';
        resultsList.appendChild(
          createResultItem(allSolutions[currentResultIndex], t.groupLabel(currentResultIndex), currentResultIndex)
        );
        prevBtn.disabled = currentResultIndex === 0;
        nextBtn.disabled = currentResultIndex === allSolutions.length - 1;
      } else {
        Array.from(resultsList.children).forEach((child, i) => {
          if (i === currentResultIndex) child.classList.add('active');
          else child.classList.remove('active');
        });
      }
    }

    function renderResults() {
      resultsList.innerHTML = '';

      if (allSolutions.length === 0) {
        resultsCard.classList.remove('show');
        nav.classList.remove('show');
        return;
      }

      resultsCard.classList.add('show');
      currentResultIndex = Math.max(0, Math.min(currentResultIndex, allSolutions.length - 1));
      showSolutionInMainGrid(allSolutions[currentResultIndex], currentResultIndex);

      const t = i18n[currentLang];
      if (allSolutions.length < 5) {
        resultsCountEl.textContent = t.resultsCountAll(allSolutions.length);
        nav.classList.remove('show');
        allSolutions.forEach((grid, index) => {
          resultsList.appendChild(createResultItem(grid, t.groupLabel(index), index));
        });
      } else {
        resultsCountEl.textContent = t.resultsCountPaginated(allSolutions.length, currentResultIndex + 1);
        resultsList.appendChild(
          createResultItem(allSolutions[currentResultIndex], t.groupLabel(currentResultIndex), currentResultIndex)
        );
        nav.classList.add('show');
        prevBtn.disabled = currentResultIndex === 0;
        nextBtn.disabled = currentResultIndex === allSolutions.length - 1;
      }
    }

    function solve() {
      clearSolvedCells();
      clearResults();

      const t = i18n[currentLang];
      if (autoDetectTarget() === false) return;
      const target = readTarget();
      const fixed = readManualValues();
      const candidates = readCandidates();
      const uniqueOnly = true;

      if (uniqueOnly) {
        const knownVals = fixed.filter(v => v !== null);
        const seenFixed = new Set();
        const dupes = [];
        for (const v of knownVals) {
          if (seenFixed.has(v)) dupes.push(v);
          else seenFixed.add(v);
        }
        if (dupes.length > 0) {
          setStatus(t.errDupeFixed(dupes.join(currentLang === 'zh' ? '、' : ', ')), 'error');
          return;
        }

        if (candidates.length > 0) {
          const candDupes = candidates.filter(c => seenFixed.has(c));
          if (candDupes.length > 0) {
            setStatus(t.errDupeCandInFixed(candDupes.join(currentLang === 'zh' ? '、' : ', ')), 'error');
            return;
          }
        }
      }

      lastFixed = fixed.slice();
      lastCandidates = candidates.slice();

      if (fixed.every(v => v === null) && candidates.length === 0) {
        setStatus(t.errNeedInput, 'error');
        return;
      }

      if (target % 3 !== 0) {
        setStatus(t.errTargetDiv3(target), 'error');
        return;
      }

      const solutions = enumerateSolutions(target, fixed, candidates, uniqueOnly);

      if (solutions.length === 0) {
        setStatus(t.errNoSolution, 'error');
        return;
      }

      allSolutions = solutions;
      renderResults();

      if (allSolutions.length === 1) {
        showSolutionInMainGrid(allSolutions[0], 0);
        setStatus(t.okSingleSolution, 'ok');
      } else {
        const base = [...allSolutions[0]].sort((a, b) => a - b).join(',');
        const sameVals = allSolutions.every(s => [...s].sort((a, b) => a - b).join(',') === base);
        if (sameVals) {
          setStatus(t.okSameNumbersMultiSolutions(allSolutions.length), 'ok');
        } else {
          setStatus(t.okMultiSolutions(allSolutions.length), 'ok');
        }
      }
    }

    function runSolve() {
      try {
        solve();
      } catch (err) {
        clearResults();
        setStatus(err.message, 'error');
      }
    }

    function tryAutoSolve() {
      try {
        const uniqueOnly = true;
        if (uniqueOnly) {
          const seenFixed = new Set();
          for (const cell of cells) {
            if (cell.dataset.source === 'manual' && cell.value.trim() !== '') {
              const v = Number(cell.value);
              if (Number.isInteger(v) && v > 0) {
                if (seenFixed.has(v)) return;
                seenFixed.add(v);
              }
            }
          }
          const candidates = readCandidates();
          if (candidates.some(c => seenFixed.has(c))) return;
        }

        const fixed = readManualValues();
        const candidates = readCandidates();

        if (fixed.every(v => v === null) && candidates.length === 0) return;
        if (targetSumEl.value.trim() === '') return;

        const target = readTarget();
        if (target % 3 !== 0) return;

        const solutions = enumerateSolutions(target, fixed, candidates, uniqueOnly);
        if (!solutions || solutions.length === 0) return;

        let shouldAutoApply = false;
        if (solutions.length === 1) {
          shouldAutoApply = true;
        } else {
          const base = [...solutions[0]].sort((a, b) => a - b).join(',');
          shouldAutoApply = solutions.every(s => [...s].sort((a, b) => a - b).join(',') === base);
        }

        fillCertainCells(solutions, fixed, candidates);
        if (!shouldAutoApply) {
          const filled = cells.filter(cell => cell.dataset.source === 'solved').length;
          setStatus(i18n[currentLang].okPartialSolution(filled), 'ok');
          return;
        }

        lastFixed = fixed.slice();
        lastCandidates = candidates.slice();
        allSolutions = solutions;
        renderResults();

        const t = i18n[currentLang];
        if (allSolutions.length === 1) {
          setStatus(t.okSingleSolution, 'ok');
        } else {
          setStatus(t.okSameNumbersMultiSolutions(allSolutions.length), 'ok');
        }
      } catch (_) {}
    }

    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
      setSharedPref('xue-lang', lang);

      const t = i18n[lang];
      document.title = t.docTitle;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', t.docDesc);

      langToggleBtn.textContent = t.langBtn;
      document.getElementById('navCurrent').textContent = t.navCurrent;
      document.getElementById('navLinkGrid').textContent = t.navGrid;
      document.getElementById('navLinkSettings').textContent = t.navSettings;

      document.getElementById('h1Title').textContent = t.h1Title;
      document.getElementById('subDesc').textContent = t.subDesc;
      document.getElementById('srOnlyTitle').textContent = t.srOnlyTitle;
      gridPrevBtn.textContent = t.gridPrevBtn;
      gridNextBtn.textContent = t.gridNextBtn;

      document.getElementById('sideTitle').textContent = t.sideTitle;
      document.getElementById('labelTargetSum').textContent = t.labelTargetSum;
      targetSumEl.placeholder = t.placeholderTargetSum;
      document.getElementById('labelCandidateValues').textContent = t.labelCandidateValues;
      candidateValuesEl.placeholder = t.placeholderCandidates;

      solveBtn.textContent = t.solveBtn;
      clearBtn.textContent = t.clearBtn;

      document.getElementById('resultsTitle').textContent = t.resultsTitle;
      prevBtn.textContent = t.prevBtn;
      nextBtn.textContent = t.nextBtn;

      document.getElementById('footerLinkTop').textContent = t.footerTop;
      document.getElementById('footerLinkHome').textContent = t.footerHome;

      if (allSolutions.length > 0) {
        renderResults();
        const base = [...allSolutions[0]].sort((a, b) => a - b).join(',');
        const sameVals = allSolutions.every(s => [...s].sort((a, b) => a - b).join(',') === base);
        if (allSolutions.length === 1) {
          setStatus(t.okSingleSolution, 'ok');
        } else if (sameVals) {
          setStatus(t.okSameNumbersMultiSolutions(allSolutions.length), 'ok');
        } else {
          setStatus(t.okMultiSolutions(allSolutions.length), 'ok');
        }
      } else {
        setStatus(t.statusEmpty);
      }
      updateCrossDomainLinks();
    }

    langToggleBtn.addEventListener('click', () => {
      const nextLang = currentLang === 'zh' ? 'en' : 'zh';
      applyLanguage(nextLang);
    });

    targetSumEl.addEventListener('input', () => {
      if (internalUpdate) return;
      targetWasAuto = false;
      clearSolvedCells();
      clearResults();
      if (autoDetectTarget() !== false) tryAutoSolve();
    });

    targetSumEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runSolve();
      }
    });

    candidateValuesEl.addEventListener('input', () => {
      clearSolvedCells();
      clearResults();
      if (autoDetectTarget() !== false) tryAutoSolve();
    });

    candidateValuesEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        runSolve();
      }
    });

    solveBtn.addEventListener('click', runSolve);
    clearBtn.addEventListener('click', clearAll);

    prevBtn.addEventListener('click', () => goToSolution(currentResultIndex - 1));
    nextBtn.addEventListener('click', () => goToSolution(currentResultIndex + 1));
    gridPrevBtn.addEventListener('click', () => goToSolution(currentResultIndex - 1));
    gridNextBtn.addEventListener('click', () => goToSolution(currentResultIndex + 1));

    applyLanguage(currentLang);
    cells[0].focus();
    </script>
</body>
</html>
